name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU and Docker gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run complete gate
        run: ./distil3d test all
